# `pdf_parse` is the parser slot. The canonical runner replaces it with
# `epub_parse` or `text_parse` when the input suffix is `.epub` or `.txt`.
pipeline:
  - pdf_parse
  - text_clean
  - heading_detect
  - split_semantic
  - ai_enrich
  - emit_jsonl

options:
  pdf_parse:
    engine: "native"
  text_clean:
    normalize_quotes: true
    repair_ligatures: true
  split_semantic:
    # chunk_size: Target words per chunk. 400 balances embedding model context
    # windows (~512 tokens) against semantic coherence. Smaller chunks increase
    # retrieval precision but lose context; larger chunks improve context but
    # dilute relevance scores.
    chunk_size: 400
    
    # overlap: Words duplicated at chunk boundaries. 100 words (~25% of chunk_size)
    # ensures queries spanning boundaries match both chunks. Industry heuristic:
    # 10-30% overlap. Higher values improve recall but increase storage/redundancy.
    # See docs/RAG_OVERLAP_ALIGNMENT_PLAN.md for design rationale.
    overlap: 100
    
    generate_metadata: true
  ai_enrich:
    enabled: true
    model: "qwen3-8b-local"
    api_base: "http://localhost:8100/v1"
    tags_dir: "config/tags"
    # Offline complete-request admission for the managed the downstream retrieval coordinator 8B profile.
    # Revalidate against the serving model/revision/context before changing pins.
    request_budget:
      model: "Qwen/Qwen3-8B-AWQ"
      revision: "4da05a8edb55c6046cce958586c33b61da07bb79"
      context_tokens: 4096
      margin_tokens: 64
      enable_thinking: false
      tokenizer_sha256: "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4"
      tokenizer_config_sha256: "d5d09f07b48c3086c508b30d1c9114bd1189145b74e982a265350c923acd8101"
  emit_jsonl:
    output_path: "out.jsonl"
