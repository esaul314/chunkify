[mypy]
files = pdf_chunker/
python_version = 3.11
strict_optional = True
warn_unused_ignores = True
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-haystack.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-numpy.*]
follow_imports = skip
ignore_missing_imports = True
